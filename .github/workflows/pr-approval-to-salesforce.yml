name: PR Approval & Merge Tracking

on:
  pull_request_review:
    types: [submitted]
  pull_request:
    types: [closed] # Triggers when a PR is merged

permissions:
  contents: read
  pull-requests: read
  checks: read
  statuses: read
  administration: read   # needed to read branch protection required checks

jobs:
  pr_process:
    runs-on: ubuntu-latest

    env:
      DOMAIN_URL: ${{ secrets.SF_DOMAIN_URL }}
      OBJECT_NAME: ${{ secrets.SF_OBJECT_NAME }}

      # ✅ OPTIONAL FALLBACK (if GitHub blocks branch protection API):
      # Put comma-separated check names in a repo Variable or Secret, ex:
      # quality-gate-code-check,quality-gate-critical-permissions-check
      REQUIRED_CHECKS_FALLBACK: ${{ vars.REQUIRED_CHECKS_FALLBACK }}

    steps:
      # -----------------------------
      # 1) Determine PR Status
      # -----------------------------
      - name: Determine PR Status
        id: pr_status_check
        shell: bash
        run: |
          PR_STATUS="Pending"
          MERGED_BY=""

          if [[ "${{ github.event.review.state }}" == "approved" ]]; then
            PR_STATUS="Approved"
          elif [[ "${{ github.event.review.state }}" == "changes_requested" ]]; then
            PR_STATUS="Changes Requested"
          fi

          if [[ "${{ github.event.pull_request.merged }}" == "true" ]]; then
            PR_STATUS="Merged"
            MERGED_BY="${{ github.event.pull_request.merged_by.login }}"
          fi

          echo "PR_STATUS=$PR_STATUS" >> "$GITHUB_OUTPUT"
          echo "MERGED_BY=$MERGED_BY" >> "$GITHUB_OUTPUT"

      # -----------------------------
      # 2) Fetch REQUIRED checks enforced on base branch (Ruleset/Protection)
      # -----------------------------
      - name: Get required checks for base branch (ruleset/branch protection)
        id: required_checks
        shell: bash
        run: |
          set -e

          BASE_BRANCH="${{ github.event.pull_request.base.ref }}"
          echo "Base branch: $BASE_BRANCH"

          API_URL="https://api.github.com/repos/${{ github.repository }}/branches/${BASE_BRANCH}/protection/required_status_checks"

          # Try to read required checks from GitHub branch protection
          HTTP_CODE=$(curl -sS -o req.json -w "%{http_code}" \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            "$API_URL" || true)

          REQUIRED_LIST=""

          if [[ "$HTTP_CODE" == "200" ]]; then
            # supports both new "checks[].context" and legacy "contexts[]"
            REQUIRED_LIST=$(jq -r '[.checks[]?.context, .contexts[]?] | map(select(. != null and . != "")) | unique | .[]' req.json | paste -sd "," -)
          fi

          # Fallback if API blocked or empty
          if [[ -z "$REQUIRED_LIST" || "$REQUIRED_LIST" == "null" ]]; then
            echo "Branch protection API not accessible or returned empty. Using fallback..."
            REQUIRED_LIST="${REQUIRED_CHECKS_FALLBACK}"
          fi

          if [[ -z "$REQUIRED_LIST" ]]; then
            echo "No required checks found (API + fallback empty)."
            echo "REQUIRED_CHECKS=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Required checks: $REQUIRED_LIST"
          echo "REQUIRED_CHECKS=$REQUIRED_LIST" >> "$GITHUB_OUTPUT"

      # -----------------------------
      # 3) Fetch check-runs for PR head SHA and FILTER only required checks
      # -----------------------------
      - name: Fetch ONLY required check runs for the PR
        id: fetch_required_checks
        shell: bash
        run: |
          set -e

          SHA="${{ github.event.pull_request.head.sha }}"
          REQUIRED="${{ steps.required_checks.outputs.REQUIRED_CHECKS }}"

          if [[ -z "$REQUIRED" ]]; then
            echo "CHECK_NAMES=" >> "$GITHUB_OUTPUT"
            echo "CHECK_STATUSES=" >> "$GITHUB_OUTPUT"
            echo "OVERALL_REQUIRED_CHECKS_STATUS=Not Configured" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          CHECK_RUNS=$(curl -sS \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/commits/${SHA}/check-runs?per_page=100")

          IFS=',' read -ra REQ_ARR <<< "$REQUIRED"

          NAMES=()
          STATUSES=()
          OVERALL="success"

          for name in "${REQ_ARR[@]}"; do
            trimmed="$(echo "$name" | xargs)"
            [[ -z "$trimmed" ]] && continue

            # pick the latest completed run for that check name, if exists
            conclusion=$(echo "$CHECK_RUNS" | jq -r --arg n "$trimmed" '
              [.check_runs[] | select(.name == $n)] 
              | sort_by(.completed_at // "") 
              | last 
              | .conclusion // "not_found"
            ')

            # normalize if still running
            status=$(echo "$CHECK_RUNS" | jq -r --arg n "$trimmed" '
              [.check_runs[] | select(.name == $n)] 
              | sort_by(.completed_at // "") 
              | last 
              | .status // "not_found"
            ')

            # If exists but not completed, mark as "in_progress"
            if [[ "$conclusion" == "null" || "$conclusion" == "" ]]; then
              conclusion="in_progress"
            fi
            if [[ "$status" != "completed" && "$status" != "not_found" ]]; then
              conclusion="in_progress"
            fi

            NAMES+=("$trimmed")
            STATUSES+=("$conclusion")

            # overall evaluation
            if [[ "$conclusion" == "failure" || "$conclusion" == "cancelled" || "$conclusion" == "timed_out" || "$conclusion" == "action_required" ]]; then
              OVERALL="failed"
            elif [[ "$conclusion" == "in_progress" || "$conclusion" == "not_found" ]]; then
              # only change overall to pending if not already failed
              if [[ "$OVERALL" != "failed" ]]; then
                OVERALL="pending"
              fi
            fi
          done

          CHECK_NAMES=$(IFS=, ; echo "${NAMES[*]}")
          CHECK_STATUSES=$(IFS=, ; echo "${STATUSES[*]}")

          echo "Filtered Check Names: $CHECK_NAMES"
          echo "Filtered Check Statuses: $CHECK_STATUSES"
          echo "Overall Required Checks Status: $OVERALL"

          echo "CHECK_NAMES=$CHECK_NAMES" >> "$GITHUB_OUTPUT"
          echo "CHECK_STATUSES=$CHECK_STATUSES" >> "$GITHUB_OUTPUT"
          echo "OVERALL_REQUIRED_CHECKS_STATUS=$OVERALL" >> "$GITHUB_OUTPUT"

      # -----------------------------
      # 4) Check if PR record exists in Salesforce
      # -----------------------------
      - name: Check if PR Record Exists in Salesforce
        id: check_existing_pr
        shell: bash
        run: |
          PR_LINK="${{ github.event.pull_request.html_url }}"

          RESPONSE=$(curl -s -X GET "${{ env.DOMAIN_URL }}/services/data/v61.0/query/?q=SELECT+Id,PR_Reviewer__c,PR_Review_Comment__c+FROM+${{ env.OBJECT_NAME }}+WHERE+PR_Link__c='${PR_LINK}'" \
            -H "Authorization: Bearer ${{ secrets.SF_ACCESS_TOKEN }}" \
            -H "Content-Type: application/json")

          RECORD_ID=$(echo "$RESPONSE" | jq -r '.records[0].Id // empty')
          EXISTING_REVIEWER=$(echo "$RESPONSE" | jq -r '.records[0].PR_Reviewer__c // empty')
          EXISTING_COMMENT=$(echo "$RESPONSE" | jq -r '.records[0].PR_Review_Comment__c // empty')

          echo "EXISTING_ID=$RECORD_ID" >> "$GITHUB_OUTPUT"
          echo "EXISTING_REVIEWER=$EXISTING_REVIEWER" >> "$GITHUB_OUTPUT"
          echo "EXISTING_COMMENT=$EXISTING_COMMENT" >> "$GITHUB_OUTPUT"

      # -----------------------------
      # 5) Create/Update Salesforce record (ONLY required checks stored)
      # -----------------------------
      - name: Send PR Information to Salesforce (Create or Update)
        shell: bash
        run: |
          prStatus="${{ steps.pr_status_check.outputs.PR_STATUS }}"
          mergedBy="${{ steps.pr_status_check.outputs.MERGED_BY }}"
          newReviewer="${{ github.event.review.user.login }}"
          newComment="${{ github.event.review.body }}"
          existingReviewer="${{ steps.check_existing_pr.outputs.EXISTING_REVIEWER }}"
          existingComment="${{ steps.check_existing_pr.outputs.EXISTING_COMMENT }}"
          recordId="${{ steps.check_existing_pr.outputs.EXISTING_ID }}"
          prLink="${{ github.event.pull_request.html_url }}"

          filteredCheckNames="${{ steps.fetch_required_checks.outputs.CHECK_NAMES }}"
          filteredCheckStatuses="${{ steps.fetch_required_checks.outputs.CHECK_STATUSES }}"
          overallRequired="${{ steps.fetch_required_checks.outputs.OVERALL_REQUIRED_CHECKS_STATUS }}"

          # Append reviewers/comments safely
          if [[ -n "$existingReviewer" && "$existingReviewer" != "null" ]]; then
            updatedReviewer="$existingReviewer $newReviewer"
          else
            updatedReviewer="$newReviewer"
          fi

          if [[ -n "$existingComment" && "$existingComment" != "null" ]]; then
            updatedComment="$existingComment  $newComment"
          else
            updatedComment="$newComment"
          fi

          # ✅ Store ONLY required checks in these fields
          PAYLOAD=$(jq -n \
            --arg title "${{ github.event.pull_request.title }}" \
            --arg link "$prLink" \
            --arg status "$prStatus" \
            --arg author "${{ github.event.pull_request.user.login }}" \
            --arg reviewer "$updatedReviewer" \
            --arg checkStatuses "$filteredCheckStatuses" \
            --arg checkNames "$filteredCheckNames" \
            --arg overall "$overallRequired" \
            --arg reviewComment "$updatedComment" \
            '{
              PR_Title__c: $title,
              PR_Link__c: $link,
              PR_Status__c: $status,
              PR_Author__c: $author,
              PR_Reviewer__c: $reviewer,
              PR_Check_Status__c: $checkStatuses,
              PR_Check_Name__c: $checkNames,
              Overall_Required_Checks__c: $overall,
              PR_Review_Comment__c: $reviewComment
            }')

          # If merged, add PR_Merged_By__c
          if [[ -n "$mergedBy" ]]; then
            PAYLOAD=$(echo "$PAYLOAD" | jq --arg mergedBy "$mergedBy" '. + { PR_Merged_By__c: $mergedBy }')
          fi

          if [[ -n "$recordId" ]]; then
            echo "Updating existing PR record: $recordId"
            RESPONSE=$(curl -s -X PATCH "${{ env.DOMAIN_URL }}/services/data/v61.0/sobjects/${{ env.OBJECT_NAME }}/$recordId" \
              -H "Authorization: Bearer ${{ secrets.SF_ACCESS_TOKEN }}" \
              -H "Content-Type: application/json" \
              -d "$PAYLOAD")
          else
            echo "Creating a new PR record"
            RESPONSE=$(curl -s -X POST "${{ env.DOMAIN_URL }}/services/data/v61.0/sobjects/${{ env.OBJECT_NAME }}/" \
              -H "Authorization: Bearer ${{ secrets.SF_ACCESS_TOKEN }}" \
              -H "Content-Type: application/json" \
              -d "$PAYLOAD")
          fi

          echo "Response: $RESPONSE"
