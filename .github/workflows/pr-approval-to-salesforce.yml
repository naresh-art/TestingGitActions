name: PR Approval & Merge Tracking

on:
  pull_request_review:
    types: [submitted]
  pull_request:
    types: [closed]  # Triggers when a PR is merged/closed

jobs:
  pr_process:
    runs-on: ubuntu-latest

    env:
      DOMAIN_URL: ${{ secrets.SF_DOMAIN_URL }}
      OBJECT_NAME: ${{ secrets.SF_OBJECT_NAME }}

      # ✅ Put your exact 2 check-run names here (must match GitHub Checks UI)
      CHECK1_EXPECTED: "quality-gate-critical-permissions-check"
      CHECK2_EXPECTED: "quality-gate-code-check"

    steps:
      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      # -----------------------------
      # 1) Authenticate to Salesforce
      # -----------------------------
      - name: Authenticate with Salesforce
        id: sf-auth
        run: |
          set -e
          response=$(curl -s -X POST "https://login.salesforce.com/services/oauth2/token" \
            -H "Content-Type: application/x-www-form-urlencoded" \
            -d "grant_type=password" \
            -d "client_id=${{ secrets.SF_CLIENT_ID }}" \
            -d "client_secret=${{ secrets.SF_CLIENT_SECRET }}" \
            -d "username=${{ secrets.SF_USERNAME }}" \
            -d "password=${{ secrets.SF_PASSWORD }}")

          SF_ACCESS_TOKEN=$(echo "$response" | jq -r '.access_token // empty')

          if [[ -z "$SF_ACCESS_TOKEN" ]]; then
            echo "Salesforce authentication failed. Response:"
            echo "$response"
            exit 1
          fi

          echo "SF_ACCESS_TOKEN=$SF_ACCESS_TOKEN" >> $GITHUB_ENV
          echo "Authenticated to Salesforce."

      # -----------------------------
      # 2) Determine PR Status safely
      # -----------------------------
      - name: Determine PR Status
        id: pr_status_check
        run: |
          set -e
          PR_STATUS="Pending"
          MERGED_BY=""

          EVENT_NAME="${{ github.event_name }}"

          # When event is pull_request_review
          if [[ "$EVENT_NAME" == "pull_request_review" ]]; then
            if [[ "${{ github.event.review.state }}" == "approved" ]]; then
              PR_STATUS="Approved"
            elif [[ "${{ github.event.review.state }}" == "changes_requested" ]]; then
              PR_STATUS="Changes Requested"
            else
              PR_STATUS="Review Submitted"
            fi
          fi

          # When event is pull_request (closed/merged)
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            if [[ "${{ github.event.pull_request.merged }}" == "true" ]]; then
              PR_STATUS="Merged"
              MERGED_BY="${{ github.event.pull_request.merged_by.login }}"
            else
              PR_STATUS="Closed"
            fi
          fi

          echo "PR_STATUS=$PR_STATUS" >> $GITHUB_OUTPUT
          echo "MERGED_BY=$MERGED_BY" >> $GITHUB_OUTPUT

      # ------------------------------------------------------------
      # 3) Fetch 2 checks from PR head sha and map to 4 SF fields
      # ------------------------------------------------------------
      - name: Fetch 2 check runs (map to Check1/Check2 fields)
        id: fetch_two_checks
        run: |
          set -e

          # PR head sha works for both events (review + closed)
          HEAD_SHA="${{ github.event.pull_request.head.sha }}"
          if [[ -z "$HEAD_SHA" || "$HEAD_SHA" == "null" ]]; then
            # For safety: some review payloads use pull_request under different path, but usually present
            HEAD_SHA="${{ github.event.pull_request.head.sha }}"
          fi

          CHECK_RUNS=$(curl -s \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github.v3+json" \
            "https://api.github.com/repos/${{ github.repository }}/commits/${HEAD_SHA}/check-runs")

          # Extract status by exact name (completed only)
          CHECK1_STATUS=$(echo "$CHECK_RUNS" | jq -r --arg n "${{ env.CHECK1_EXPECTED }}" '
            (.check_runs[] | select(.name==$n) | select(.status=="completed") | (.conclusion // "unknown")) // empty' | head -n 1)

          CHECK2_STATUS=$(echo "$CHECK_RUNS" | jq -r --arg n "${{ env.CHECK2_EXPECTED }}" '
            (.check_runs[] | select(.name==$n) | select(.status=="completed") | (.conclusion // "unknown")) // empty' | head -n 1)

          # If checks are not completed/found yet
          if [[ -z "$CHECK1_STATUS" ]]; then CHECK1_STATUS="not_found"; fi
          if [[ -z "$CHECK2_STATUS" ]]; then CHECK2_STATUS="not_found"; fi

          echo "CHECK1_NAME=${{ env.CHECK1_EXPECTED }}" >> $GITHUB_OUTPUT
          echo "CHECK1_STATUS=$CHECK1_STATUS" >> $GITHUB_OUTPUT
          echo "CHECK2_NAME=${{ env.CHECK2_EXPECTED }}" >> $GITHUB_OUTPUT
          echo "CHECK2_STATUS=$CHECK2_STATUS" >> $GITHUB_OUTPUT

          echo "Check1 => ${{ env.CHECK1_EXPECTED }} : $CHECK1_STATUS"
          echo "Check2 => ${{ env.CHECK2_EXPECTED }} : $CHECK2_STATUS"

      # ------------------------------------------------------------
      # 4) Find existing PR record in Salesforce using PR link
      # ------------------------------------------------------------
      - name: Check if PR Record Exists in Salesforce
        id: check_existing_pr
        run: |
          set -e
          PR_LINK="${{ github.event.pull_request.html_url }}"

          # NOTE: quotes inside SOQL must be escaped if PR_LINK has special chars (usually safe).
          SOQL="SELECT Id,PR_Status__c,PR_Reviewer__c,PR_Review_Comment__c FROM ${{ env.OBJECT_NAME }} WHERE PR_Link__c='${PR_LINK}' LIMIT 1"

          RESPONSE=$(curl -s -X GET "${{ env.DOMAIN_URL }}/services/data/v61.0/query/?q=$(python3 -c "import urllib.parse; print(urllib.parse.quote('''$SOQL'''))")" \
            -H "Authorization: Bearer ${{ env.SF_ACCESS_TOKEN }}" \
            -H "Content-Type: application/json")

          RECORD_ID=$(echo "$RESPONSE" | jq -r '.records[0].Id // empty')
          EXISTING_REVIEWER=$(echo "$RESPONSE" | jq -r '.records[0].PR_Reviewer__c // empty')
          EXISTING_COMMENT=$(echo "$RESPONSE" | jq -r '.records[0].PR_Review_Comment__c // empty')

          echo "EXISTING_ID=$RECORD_ID" >> $GITHUB_OUTPUT
          echo "EXISTING_REVIEWER=$EXISTING_REVIEWER" >> $GITHUB_OUTPUT
          echo "EXISTING_COMMENT=$EXISTING_COMMENT" >> $GITHUB_OUTPUT

          if [[ -n "$RECORD_ID" ]]; then
            echo "Existing PR Record Found: $RECORD_ID"
          else
            echo "No existing PR record found"
          fi

      # ------------------------------------------------------------
      # 5) Create or Update PR in Salesforce + write 4 check fields
      # ------------------------------------------------------------
      - name: Send PR Information to Salesforce (Create or Update)
        run: |
          set -e

          prStatus="${{ steps.pr_status_check.outputs.PR_STATUS }}"
          mergedBy="${{ steps.pr_status_check.outputs.MERGED_BY }}"
          recordId="${{ steps.check_existing_pr.outputs.EXISTING_ID }}"
          prLink="${{ github.event.pull_request.html_url }}"

          # reviewer/comment may not exist on "pull_request closed" event
          newReviewer="${{ github.event.review.user.login }}"
          newComment="${{ github.event.review.body }}"

          existingReviewer="${{ steps.check_existing_pr.outputs.EXISTING_REVIEWER }}"
          existingComment="${{ steps.check_existing_pr.outputs.EXISTING_COMMENT }}"

          # Safely handle null review fields on pull_request event
          if [[ -z "$newReviewer" || "$newReviewer" == "null" ]]; then newReviewer=""; fi
          if [[ -z "$newComment" || "$newComment" == "null" ]]; then newComment=""; fi

          # Retain existing reviewers and append new
          if [[ -n "$existingReviewer" && "$existingReviewer" != "null" && -n "$newReviewer" ]]; then
            updatedReviewer="$existingReviewer $newReviewer"
          elif [[ -n "$existingReviewer" && "$existingReviewer" != "null" ]]; then
            updatedReviewer="$existingReviewer"
          else
            updatedReviewer="$newReviewer"
          fi

          # Retain existing comments and append new
          if [[ -n "$existingComment" && "$existingComment" != "null" && -n "$newComment" ]]; then
            updatedComment="$existingComment  $newComment"
          elif [[ -n "$existingComment" && "$existingComment" != "null" ]]; then
            updatedComment="$existingComment"
          else
            updatedComment="$newComment"
          fi

          CHECK1_NAME="${{ steps.fetch_two_checks.outputs.CHECK1_NAME }}"
          CHECK1_STATUS="${{ steps.fetch_two_checks.outputs.CHECK1_STATUS }}"
          CHECK2_NAME="${{ steps.fetch_two_checks.outputs.CHECK2_NAME }}"
          CHECK2_STATUS="${{ steps.fetch_two_checks.outputs.CHECK2_STATUS }}"

          # Build payload safely using jq (avoids JSON breaking due to quotes)
          PAYLOAD=$(jq -n \
            --arg title "${{ github.event.pull_request.title }}" \
            --arg link "$prLink" \
            --arg status "$prStatus" \
            --arg author "${{ github.event.pull_request.user.login }}" \
            --arg reviewer "$updatedReviewer" \
            --arg comment "$updatedComment" \
            --arg c1n "$CHECK1_NAME" \
            --arg c1s "$CHECK1_STATUS" \
            --arg c2n "$CHECK2_NAME" \
            --arg c2s "$CHECK2_STATUS" \
            '{
              PR_Title__c: $title,
              PR_Link__c: $link,
              PR_Status__c: $status,
              PR_Author__c: $author,
              PR_Reviewer__c: $reviewer,
              PR_Review_Comment__c: $comment,
              Check1_Action_Name__c: $c1n,
              Check1_Action_Status__c: $c1s,
              Check2_Action_Name__c: $c2n,
              Check2_Action_Status__c: $c2s
            }')

          # Add merged by if present
          if [[ -n "$mergedBy" ]]; then
            PAYLOAD=$(echo "$PAYLOAD" | jq --arg mb "$mergedBy" '. + { PR_Merged_By__c: $mb }')
          fi

          if [[ -n "$recordId" ]]; then
            echo "Updating existing PR record: $recordId"
            RESPONSE=$(curl -s -X PATCH "${{ env.DOMAIN_URL }}/services/data/v61.0/sobjects/${{ env.OBJECT_NAME }}/$recordId" \
              -H "Authorization: Bearer ${{ env.SF_ACCESS_TOKEN }}" \
              -H "Content-Type: application/json" \
              -d "$PAYLOAD")
          else
            echo "Creating a new PR record"
            RESPONSE=$(curl -s -X POST "${{ env.DOMAIN_URL }}/services/data/v61.0/sobjects/${{ env.OBJECT_NAME }}/" \
              -H "Authorization: Bearer ${{ env.SF_ACCESS_TOKEN }}" \
              -H "Content-Type: application/json" \
              -d "$PAYLOAD")
          fi

          echo "Salesforce Response: $RESPONSE"
