name: PR Approval & Merge Tracking

on:
  pull_request_review:
    types: [submitted]
  pull_request:
    types: [closed]   # triggers when PR is closed (merged or not)

jobs:
  pr_process:
    runs-on: ubuntu-latest

    env:
      DOMAIN_URL: ${{ secrets.SF_DOMAIN_URL }}     # example: https://yourdomain.my.salesforce.com
      OBJECT_NAME: ${{ secrets.SF_OBJECT_NAME }}   # example: Pull_Request__c

    steps:
      # -------------------------------------------------------
      # 0) SALESFORCE AUTH (MUST)
      # -------------------------------------------------------
      - name: Authenticate with Salesforce
        id: sf-auth
        shell: bash
        run: |
          set -e
          response=$(curl -sS -X POST "https://login.salesforce.com/services/oauth2/token" \
            -d "grant_type=password" \
            -d "client_id=${{ secrets.SF_CLIENT_ID }}" \
            -d "client_secret=${{ secrets.SF_CLIENT_SECRET }}" \
            -d "username=${{ secrets.SF_USERNAME }}" \
            -d "password=${{ secrets.SF_PASSWORD }}")

          echo "Auth response: $response"

          SF_ACCESS_TOKEN=$(echo "$response" | jq -r '.access_token // empty')
          if [[ -z "$SF_ACCESS_TOKEN" ]]; then
            echo "Salesforce authentication failed."
            exit 1
          fi

          echo "SF_ACCESS_TOKEN=$SF_ACCESS_TOKEN" >> "$GITHUB_ENV"
          echo "Authenticated successfully."

      # -------------------------------------------------------
      # 1) DETERMINE PR STATUS
      # -------------------------------------------------------
      - name: Determine PR Status
        id: pr_status_check
        shell: bash
        run: |
          PR_STATUS="Pending"
          MERGED_BY=""

          # For pull_request_review event
          if [[ "${{ github.event_name }}" == "pull_request_review" ]]; then
            if [[ "${{ github.event.review.state }}" == "approved" ]]; then
              PR_STATUS="Approved"
            elif [[ "${{ github.event.review.state }}" == "changes_requested" ]]; then
              PR_STATUS="Changes Requested"
            fi
          fi

          # For pull_request closed event (merged)
          if [[ "${{ github.event_name }}" == "pull_request" && "${{ github.event.pull_request.merged }}" == "true" ]]; then
            PR_STATUS="Merged"
            MERGED_BY="${{ github.event.pull_request.merged_by.login }}"
          fi

          echo "PR_STATUS=$PR_STATUS" >> "$GITHUB_OUTPUT"
          echo "MERGED_BY=$MERGED_BY" >> "$GITHUB_OUTPUT"

      # -------------------------------------------------------
      # 2) FETCH ALL CHECK RUNS FOR PR
      # -------------------------------------------------------
      - name: Fetch all check runs for the PR
        id: fetch_checks
        shell: bash
        run: |
          CHECK_RUNS=$(curl -sS -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github.v3+json" \
            "https://api.github.com/repos/${{ github.repository }}/commits/${{ github.event.pull_request.head.sha }}/check-runs")

          CHECK_NAMES=$(echo "$CHECK_RUNS" | jq -r '.check_runs[] | select(.status == "completed") | .name' | paste -sd "," -)
          CHECK_STATUSES=$(echo "$CHECK_RUNS" | jq -r '.check_runs[] | select(.status == "completed") | .conclusion' | paste -sd "," -)

          echo "CHECK_NAMES=$CHECK_NAMES" >> "$GITHUB_OUTPUT"
          echo "CHECK_STATUSES=$CHECK_STATUSES" >> "$GITHUB_OUTPUT"

      # -------------------------------------------------------
      # 3) CHECK IF RECORD EXISTS IN SALESFORCE (FIXED)
      # -------------------------------------------------------
      - name: Check if PR Record Exists in Salesforce
        id: check_existing_pr
        shell: bash
        run: |
          set -e

          PR_LINK="${{ github.event.pull_request.html_url }}"

          # Build SOQL and URL-encode safely
          SOQL="SELECT Id, PR_Status__c, PR_Reviewer__c, PR_Review_Comment__c FROM ${{ env.OBJECT_NAME }} WHERE PR_Link__c = '${PR_LINK}'"

          RESPONSE=$(curl -sS --get \
            "${{ env.DOMAIN_URL }}/services/data/v61.0/query" \
            -H "Authorization: Bearer ${{ env.SF_ACCESS_TOKEN }}" \
            -H "Content-Type: application/json" \
            --data-urlencode "q=$SOQL")

          echo "Salesforce query response: $RESPONSE"

          # If Salesforce returned an error (often an array), stop with message
          if echo "$RESPONSE" | jq -e 'type=="array" and .[0].errorCode' >/dev/null 2>&1; then
            echo "Salesforce API error:"
            echo "$RESPONSE" | jq .
            exit 1
          fi

          RECORD_ID=$(echo "$RESPONSE" | jq -r '.records[0].Id // empty')
          EXISTING_REVIEWER=$(echo "$RESPONSE" | jq -r '.records[0].PR_Reviewer__c // ""')
          EXISTING_COMMENT=$(echo "$RESPONSE" | jq -r '.records[0].PR_Review_Comment__c // ""')

          echo "EXISTING_ID=$RECORD_ID" >> "$GITHUB_OUTPUT"
          echo "EXISTING_REVIEWER=$EXISTING_REVIEWER" >> "$GITHUB_OUTPUT"
          echo "EXISTING_COMMENT=$EXISTING_COMMENT" >> "$GITHUB_OUTPUT"

      # -------------------------------------------------------
      # 4) CREATE OR UPDATE RECORD IN SALESFORCE
      # -------------------------------------------------------
      - name: Send PR Information to Salesforce (Create or Update)
        shell: bash
        run: |
          set -e

          prStatus="${{ steps.pr_status_check.outputs.PR_STATUS }}"
          mergedBy="${{ steps.pr_status_check.outputs.MERGED_BY }}"
          recordId="${{ steps.check_existing_pr.outputs.EXISTING_ID }}"
          prLink="${{ github.event.pull_request.html_url }}"

          # review info exists only for pull_request_review event
          newReviewer=""
          newComment=""
          if [[ "${{ github.event_name }}" == "pull_request_review" ]]; then
            newReviewer="${{ github.event.review.user.login }}"
            newComment="${{ github.event.review.body }}"
          fi

          existingReviewer="${{ steps.check_existing_pr.outputs.EXISTING_REVIEWER }}"
          existingComment="${{ steps.check_existing_pr.outputs.EXISTING_COMMENT }}"

          # Append reviewer/comment only if review event
          updatedReviewer="$existingReviewer"
          updatedComment="$existingComment"

          if [[ -n "$newReviewer" ]]; then
            if [[ -n "$updatedReviewer" ]]; then
              updatedReviewer="$updatedReviewer, $newReviewer"
            else
              updatedReviewer="$newReviewer"
            fi
          fi

          if [[ -n "$newComment" ]]; then
            if [[ -n "$updatedComment" ]]; then
              updatedComment="$updatedComment  ||  $newComment"
            else
              updatedComment="$newComment"
            fi
          fi

          PAYLOAD=$(jq -n \
            --arg title "${{ github.event.pull_request.title }}" \
            --arg link "$prLink" \
            --arg status "$prStatus" \
            --arg author "${{ github.event.pull_request.user.login }}" \
            --arg reviewer "$updatedReviewer" \
            --arg checkStatus "${{ steps.fetch_checks.outputs.CHECK_STATUSES }}" \
            --arg checkName "${{ steps.fetch_checks.outputs.CHECK_NAMES }}" \
            --arg comment "$updatedComment" \
            '{
              PR_Title__c: $title,
              PR_Link__c: $link,
              PR_Status__c: $status,
              PR_Author__c: $author,
              PR_Reviewer__c: $reviewer,
              PR_Check_Status__c: $checkStatus,
              PR_Check_Name__c: $checkName,
              PR_Review_Comment__c: $comment
            }')

          if [[ -n "$mergedBy" ]]; then
            PAYLOAD=$(echo "$PAYLOAD" | jq --arg mergedBy "$mergedBy" '. + { PR_Merged_By__c: $mergedBy }')
          fi

          echo "Payload: $PAYLOAD"

          if [[ -n "$recordId" ]]; then
            echo "Updating existing PR record: $recordId"
            RESPONSE=$(curl -sS -X PATCH "${{ env.DOMAIN_URL }}/services/data/v61.0/sobjects/${{ env.OBJECT_NAME }}/$recordId" \
              -H "Authorization: Bearer ${{ env.SF_ACCESS_TOKEN }}" \
              -H "Content-Type: application/json" \
              -d "$PAYLOAD")
          else
            echo "Creating a new PR record"
            RESPONSE=$(curl -sS -X POST "${{ env.DOMAIN_URL }}/services/data/v61.0/sobjects/${{ env.OBJECT_NAME }}/" \
              -H "Authorization: Bearer ${{ env.SF_ACCESS_TOKEN }}" \
              -H "Content-Type: application/json" \
              -d "$PAYLOAD")
          fi

          echo "Salesforce write response: $RESPONSE"
