name: Delta Scan Every 5 Minutes

on:
  schedule:
    - cron: '*/5 * * * *'     # Runs every 5 minutes (UTC time)
  workflow_dispatch:          # Allows manual runs if needed

jobs:
  run-delta-scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v3

      - name: Run Delta File Script
        run: |
          echo "Generating delta file..."
          bash ./scripts/generate-delta.sh  # Replace with your real script

      - name: Commit and Push Delta File
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Auto-update delta file [skip ci]" || echo "No changes"
          git push
