name: Delta File Scan Every 5 Minute (GitHub allows ~5 mins)

on:
  schedule:
    - cron: '*/5 * * * *'  # Every 5 minutes (GitHub limitation)
  workflow_dispatch:       # Allow manual trigger

jobs:
  delta-scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Node.js (optional, if you're using Node)
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Run Delta File Scan Script
        run: |
          echo "Running delta scan..."
          # Replace below line with your actual delta file generator script
          bash ./scripts/generate-delta.sh

      - name: Commit Delta File
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Update delta file [skip ci]" || echo "No changes to commit"
          git push
