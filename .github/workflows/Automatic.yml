name: Scheduler - Trigger Delta Scan Every 5 Minutes

on:
  schedule:
    - cron: '*/5 * * * *'  # Every 5 minutes
  workflow_dispatch:

jobs:
  trigger-delta-workflow:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Delta Workflow
        uses: peter-evans/workflow-dispatch@v2  # Change to v2 for better compatibility
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          workflow: Salesforce Code Scan and Critical Permissions Check on Pull Request  # Use the workflow name, not filename
          ref: main
