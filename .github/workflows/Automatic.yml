name: Scheduler - Trigger Delta Scan Every 5 Minutes

on:
  schedule:
    - cron: '*/5 * * * *'  # Every 5 minutes
  workflow_dispatch:

jobs:
  trigger-delta-workflow:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Delta Workflow
        uses: peter-evans/workflow-dispatch@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          workflow: Salesforce Code Scan and Critical Permissions Check on Pull Request  # ✅ use the workflow `name` not the filename
          ref: main
