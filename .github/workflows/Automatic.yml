name: Scheduler - Trigger Delta Scan Every 5 Minutes

on:
  schedule:
    - cron: '*/5 * * * *'  # Every 5 minutes
  workflow_dispatch:       # Optional: Allow manual testing of this scheduler

jobs:
  trigger-delta-workflow:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Delta Workflow
        uses: peter-evans/workflow-dispatch@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          workflow: delta-scan.yml   # ✅ Must match the filename of your delta workflow
          ref: main             # Or your default branch
