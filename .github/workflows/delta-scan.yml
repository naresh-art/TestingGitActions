name: Salesforce Code Scan and Critical Permissions Check on Pull Request

on:
  pull_request:
    branches:
      - '**'
  workflow_dispatch:

jobs:
  quality-gate-code-check:
    runs-on: ubuntu-latest
    outputs:
      block-pr: ${{ steps.block-check.outputs.block-status }}

    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0

      # ✅ Your exact step (kept as you provided)
      - name: Get Repository and Branch Info
        shell: bash
        run: |
          set -euo pipefail
          REPO_NAME="$(echo "${GITHUB_REPOSITORY}" | cut -d'/' -f2)"
          # ✅ Target branch for PRs (base branch)
          if [[ "${GITHUB_EVENT_NAME}" == "pull_request" ]]; then
            TARGET_BRANCH="${GITHUB_BASE_REF}"
            SOURCE_BRANCH="${GITHUB_HEAD_REF}"
          else
            TARGET_BRANCH="${GITHUB_REF#refs/heads/}"
            SOURCE_BRANCH="${TARGET_BRANCH}"
          fi
          COMMIT_LABEL="$(git log -1 --pretty=format:'%s')"
          echo "REPO_NAME=${REPO_NAME}" >> "$GITHUB_ENV"
          echo "TARGET_BRANCH=${TARGET_BRANCH}" >> "$GITHUB_ENV"
          echo "SOURCE_BRANCH=${SOURCE_BRANCH}" >> "$GITHUB_ENV"
          echo "COMMIT_LABEL=${COMMIT_LABEL}" >> "$GITHUB_ENV"
          FILE_TITLE="Code Scanner Report_${REPO_NAME}_${TARGET_BRANCH}_${COMMIT_LABEL}"
          echo "Target Branch = ${TARGET_BRANCH}"
          echo "Source Branch = ${SOURCE_BRANCH}"
          echo "FILE_TITLE=${FILE_TITLE}" >> $GITHUB_ENV

      # ✅ Make filename SAFE + UNIQUE (timestamp + sha) using your FILE_TITLE
      - name: Generate Unique Report File Name
        if: always()
        shell: bash
        run: |
          set -euo pipefail

          TIMESTAMP=$(date +'%Y%m%d-%H%M%S')
          SHORT_SHA=$(git rev-parse --short HEAD)

          # sanitize FILE_TITLE so it becomes a valid file name
          SAFE_TITLE=$(echo "${FILE_TITLE}" | tr ' ' '_' | tr -cd 'A-Za-z0-9_.-')
          SAFE_TITLE=$(echo "${SAFE_TITLE}" | cut -c1-120)

          REPORT_FILE="${SAFE_TITLE}_${TIMESTAMP}_${SHORT_SHA}.csv"
          echo "REPORT_FILE=${REPORT_FILE}" >> "$GITHUB_ENV"
          echo "✅ REPORT_FILE=${REPORT_FILE}"

      - name: Use Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 20.x

      - name: Install Salesforce CLI
        run: npm install @salesforce/cli --global

      - name: Install Scanner Plugin
        run: sf plugins install @salesforce/sfdx-scanner

      - name: Verify Salesforce CLI Installation
        run: sf --version

      - name: Verify Scanner Plugin Installation
        run: sf plugins --core

      - name: Get changed files
        id: get-changes
        shell: bash
        run: |
          set -euo pipefail
          git fetch --unshallow || true
          if [ "$(git rev-list --count HEAD)" -gt "1" ]; then
            echo "Fetching changed files between HEAD~1 and HEAD"
            git diff --name-only HEAD~1 HEAD > changed_files.txt
          else
            echo "No previous commit to compare to." > changed_files.txt
          fi
          cat changed_files.txt

      - name: Run SFDX Scanner on All Changed Files
        id: run-scanner
        shell: bash
        run: |
          set -euo pipefail
          files=$(cat changed_files.txt | grep -E '\.cls$|\.js$|\.html$|\.xml$' || true)
          echo "Files to scan: $files"

          rm -f scanner-report.csv
          touch scanner-report.csv

          if [ -n "$files" ]; then
            for file in $files; do
              echo "Running scanner on $file"
              sf scanner:run --target "$file" --format csv --outfile temp-scanner-report.csv || { echo "Scanner run failed on $file"; exit 1; }

              if [ -s scanner-report.csv ]; then
                tail -n +2 temp-scanner-report.csv >> scanner-report.csv
              else
                cat temp-scanner-report.csv >> scanner-report.csv
              fi
            done
            rm -f temp-scanner-report.csv
          else
            echo "No relevant files changed."
          fi
        env:
          SF_LAZY_LOAD_MODULES: 'true'
          SF_AUTOUPDATE_DISABLE: 'true'
          SF_DISABLE_AUTOUPDATE: 'true'

      - name: Block PR merge if severity violations are found
        id: block-check
        shell: bash
        run: |
          set -euo pipefail
          if [ -f scanner-report.csv ]; then
            echo "Processing scanner-report.csv"
            severity_fail_count=$(awk -F',' '{gsub(/^ *| *$/, "", $2); if($2 == "\"3\"") count++} END {print count+0}' scanner-report.csv)
            echo "Severity 3 issues count: $severity_fail_count"

            if [ "$severity_fail_count" -gt 0 ]; then
              echo "Blocking your pull request due to severity 3 vulnerabilities found."
              echo "block-status=true" >> "$GITHUB_OUTPUT"
              exit 1
            else
              echo "No severity 3 vulnerabilities found. Proceeding with Approval."
              echo "block-status=false" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "No scanner report found."
            echo "block-status=true" >> "$GITHUB_OUTPUT"
            exit 1
          fi

      # ✅ Copy to your unique filename (REPORT_FILE)
      - name: Rename Scanner Report File
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          cp scanner-report.csv "${REPORT_FILE}"
          echo "✅ Copied scanner-report.csv -> ${REPORT_FILE}"

      # ✅ Upload artifact with same unique name
      - name: Upload Scanner Report
        id: upload-report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SFDX_Code_Scan_Report_${{ env.REPORT_FILE }}
          path: ${{ env.REPORT_FILE }}

  quality-gate-critical-permissions-check:
    runs-on: ubuntu-latest
    needs: quality-gate-code-check
    if: ${{ needs.quality-gate-code-check.outputs.block-pr == 'false' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 2

      - name: Get changed files
        id: changed-files
        shell: bash
        run: |
          set -euo pipefail
          git diff --name-only HEAD^ HEAD > changed_files.txt
          touch filtered_files.txt
          grep -E 'force-app/main/default/(profiles|permissionsets)/.*\.(profile|permissionset)-meta\.xml' changed_files.txt > filtered_files.txt || true
          echo "Filtered files:"
          cat filtered_files.txt || true

      - name: Scan only changed Profiles and Permission Sets for Critical Permissions
        shell: bash
        run: |
          set -euo pipefail
          CRITICAL_PERMISSIONS=(
              "AssignPermissionSets"
              "AuthorApex"
              "CustomizeApplication"
              "FreezeUsers"
              "ManageEncryptionKeys"
              "ManageInternalUsers"
              "ManagePasswordPolicies"
              "ManageProfilesPermissionSets"
              "ManageRoles"
              "ManageSharing"
              "ManageUsers"
              "ModifyAllData"
              "MonitorLoginHistory"
              "MultiFactorAuthenticationRequired"
              "PasswordNeverExpires"
              "ResetPasswordsUnlockUsers"
              "ViewAllData"
          )

          BLOCKED_FILES=()

          if [ ! -s filtered_files.txt ]; then
            echo "No profile or permission set files were modified."
            exit 0
          fi

          while IFS= read -r FILE; do
            [[ -z "$FILE" ]] && continue
            [[ ! -f "$FILE" ]] && continue

            for PERMISSION in "${CRITICAL_PERMISSIONS[@]}"; do
              if grep -q "$PERMISSION" "$FILE" && ! grep -q "System Administrator" "$FILE"; then
                BLOCKED_FILES+=("$FILE")
                break
              fi
            done
          done < filtered_files.txt

          if [ ${#BLOCKED_FILES[@]} -gt 0 ]; then
            echo "❌ Critical permissions found in the following modified files:"
            for FILE in "${BLOCKED_FILES[@]}"; do
              echo "$FILE"
            done
            exit 1
          else
            echo "✅ No critical permissions found in modified files."
          fi
