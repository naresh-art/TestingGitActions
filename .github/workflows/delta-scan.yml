name: Salesforce Code Scan and Critical Permissions Check on Pull Request

on:
  pull_request:
    branches:
      - "**"
  workflow_dispatch:

jobs:
  quality-gate-code-check:
    runs-on: ubuntu-latest
    outputs:
      block-pr: ${{ steps.block-check.outputs.block-status }}

    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Use Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 20.x

      - name: Install Salesforce CLI
        run: npm install @salesforce/cli --global

      - name: Install Scanner Plugin
        run: sf plugins install @salesforce/sfdx-scanner

      - name: Verify Salesforce CLI Installation
        run: sf --version

      - name: Verify Scanner Plugin Installation
        run: sf plugins --core

      - name: Get changed files
        id: get-changes
        run: |
          git fetch --unshallow || true
          if [ "$(git rev-list --count HEAD)" -gt "1" ]; then
            git diff --name-only HEAD~1 HEAD > changed_files.txt
          else
            echo "No previous commit to compare to." > changed_files.txt
          fi
          cat changed_files.txt

      - name: Run SFDX Scanner on All Changed Files
        id: run-scanner
        run: |
          files=$(cat changed_files.txt | grep -E '\.cls$|\.lwc$' || true)
          echo "Files to scan: $files"

          rm -f scanner-report.csv
          touch scanner-report.csv

          if [ -n "$files" ]; then
            for file in $files; do
              echo "Running scanner on $file"
              sf scanner:run --target "$file" --format csv --outfile temp-scanner-report.csv || { echo "Scanner run failed on $file"; exit 1; }

              if [ -s scanner-report.csv ]; then
                tail -n +2 temp-scanner-report.csv >> scanner-report.csv
              else
                cat temp-scanner-report.csv >> scanner-report.csv
              fi
            done
            rm -f temp-scanner-report.csv
          else
            echo "No relevant files changed."
          fi
        env:
          SF_LAZY_LOAD_MODULES: "true"
          SF_AUTOUPDATE_DISABLE: "true"
          SF_DISABLE_AUTOUPDATE: "true"

      # ✅ 1) Generate Unique File Name
      - name: Generate file name for scanner report
        if: always()
        id: gen-name
        run: |
          COMMIT_LABEL=$(git log -1 --pretty=format:'%s' | tr ' ' '_' | tr -cd 'A-Za-z0-9_.-')
          SHORT_SHA=$(git rev-parse --short HEAD)
          REPORT_FILE="${COMMIT_LABEL}-${SHORT_SHA}.csv"

          PR_NUMBER="${{ github.event.pull_request.number }}"
          if [ -z "$PR_NUMBER" ]; then
            PR_NUMBER="manual"
          fi

          REPORT_DIR="scanner-reports/PR-${PR_NUMBER}"
          BACKUP_DIR="scanner-reports-backup/run-${{ github.run_id }}"

          echo "REPORT_FILE=$REPORT_FILE" >> $GITHUB_ENV
          echo "REPORT_DIR=$REPORT_DIR" >> $GITHUB_ENV
          echo "BACKUP_DIR=$BACKUP_DIR" >> $GITHUB_ENV

          echo "✅ Generated file name: $REPORT_FILE"
          echo "✅ Report folder: $REPORT_DIR"
          echo "✅ Backup folder: $BACKUP_DIR"

      # ✅ 2) Save Scanner Report into folder (before any checkout/other steps)
      - name: Save Scanner Report into folder
        if: always()
        run: |
          if [ ! -f scanner-report.csv ]; then
            echo "❌ scanner-report.csv not found. Creating empty report."
            echo "rule,engine,severity,tags,file,startLine,startColumn,endLine,endColumn,message,resources" > scanner-report.csv
          fi

          mkdir -p "${{ env.REPORT_DIR }}"
          cp scanner-report.csv "${{ env.REPORT_DIR }}/${{ env.REPORT_FILE }}"
          echo "✅ Saved report: ${{ env.REPORT_DIR }}/${{ env.REPORT_FILE }}"

      # ✅ 3) Backup Scanner Report into backup folder
      - name: Backup Scanner Report
        if: always()
        run: |
          mkdir -p "${{ env.BACKUP_DIR }}"
          cp scanner-report.csv "${{ env.BACKUP_DIR }}/${{ env.REPORT_FILE }}"
          echo "✅ Backup created: ${{ env.BACKUP_DIR }}/${{ env.REPORT_FILE }}"

      # ✅ Block PR if severity 3 found
      - name: Block PR merge if severity violations are found
        id: block-check
        run: |
          if [ -f scanner-report.csv ]; then
            echo "Processing scanner-report.csv"
            severity_fail_count=$(awk -F',' '{gsub(/^ *| *$/, "", $2); if($2 == "\"3\"") count++} END {print count+0}' scanner-report.csv)
            echo "Severity 3 issues count: $severity_fail_count"

            if [ "$severity_fail_count" -gt 0 ]; then
              echo "Blocking PR due to severity 3 issues."
              echo "block-status=true" >> $GITHUB_OUTPUT
              exit 1
            else
              echo "No severity 3 issues. Proceeding."
              echo "block-status=false" >> $GITHUB_OUTPUT
            fi
          else
            echo "No scanner report found."
            echo "block-status=true" >> $GITHUB_OUTPUT
            exit 1
          fi

      # ✅ 4) Upload Artifact (uploads the folder)
      - name: Upload Scanner Report Artifact (folder)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SFDX_Code_Scan_Reports
          path: |
            ${{ env.REPORT_DIR }}
            ${{ env.BACKUP_DIR }}

      # ✅ 5) Upload report file into Salesforce as File (ContentVersion)
      - name: Authenticate to Salesforce (for file upload)
        if: always()
        run: |
          DOMAIN_URL="${{ secrets.SF_DOMAIN_URL }}"
          API_VERSION="${{ secrets.SF_API_VERSION }}"
          if [ -z "$API_VERSION" ]; then API_VERSION="v60.0"; fi

          echo "Using domain: $DOMAIN_URL"
          echo "Using API version: $API_VERSION"

          response=$(curl -s -X POST "${DOMAIN_URL}/services/oauth2/token" \
            -H "Content-Type: application/x-www-form-urlencoded" \
            --data-urlencode "grant_type=password" \
            --data-urlencode "client_id=${{ secrets.SF_CLIENT_ID }}" \
            --data-urlencode "client_secret=${{ secrets.SF_CLIENT_SECRET }}" \
            --data-urlencode "username=${{ secrets.SF_USERNAME }}" \
            --data-urlencode "password=${{ secrets.SF_PASSWORD }}" )

          SF_ACCESS_TOKEN=$(echo "$response" | jq -r '.access_token')
          if [ -z "$SF_ACCESS_TOKEN" ] || [ "$SF_ACCESS_TOKEN" = "null" ]; then
            echo "❌ Salesforce authentication failed: $response"
            exit 1
          fi

          echo "SF_ACCESS_TOKEN=$SF_ACCESS_TOKEN" >> $GITHUB_ENV
          echo "SF_API_VERSION=$API_VERSION" >> $GITHUB_ENV
          echo "✅ Salesforce authenticated."

      - name: Upload report into Salesforce Files (ContentVersion)
        if: always()
        run: |
          DOMAIN_URL="${{ secrets.SF_DOMAIN_URL }}"
          रिपोर्ट_PATH="${{ env.REPORT_DIR }}/${{ env.REPORT_FILE }}"

          if [ ! -f "$रिपोर्ट_PATH" ]; then
            echo "❌ Report not found at $रिपोर्ट_PATH"
            exit 1
          fi

          BASE64_DATA=$(base64 -w 0 "$रिपोर्ट_PATH")

          BODY=$(jq -n \
            --arg title "${{ env.REPORT_FILE }}" \
            --arg path "${{ env.REPORT_FILE }}" \
            --arg data "$BASE64_DATA" \
            '{
              Title: $title,
              PathOnClient: $path,
              VersionData: $data
            }')

          upload_resp=$(curl -s -X POST "${DOMAIN_URL}/services/data/${{ env.SF_API_VERSION }}/sobjects/ContentVersion" \
            -H "Authorization: Bearer ${{ env.SF_ACCESS_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d "$BODY")

          CV_ID=$(echo "$upload_resp" | jq -r '.id')
          if [ -z "$CV_ID" ] || [ "$CV_ID" = "null" ]; then
            echo "❌ File upload failed: $upload_resp"
            exit 1
          fi

          echo "✅ Uploaded to Salesforce ContentVersion Id: $CV_ID"

  quality-gate-critical-permissions-check:
    runs-on: ubuntu-latest
    needs: quality-gate-code-check
    if: ${{ needs.quality-gate-code-check.outputs.block-pr == 'false' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 2

      - name: Get changed files
        id: changed-files
        run: |
          git diff --name-only HEAD^ HEAD > changed_files.txt
          touch filtered_files.txt
          grep -E 'force-app/main/default/(profiles|permissionsets)/.*\.(profile|permissionset)-meta\.xml' changed_files.txt > filtered_files.txt || echo "" > filtered_files.txt

      - name: Scan only changed Profiles and Permission Sets for Critical Permissions
        run: |
          CRITICAL_PERMISSIONS=(
              "AssignPermissionSets"
              "AuthorApex"
              "CustomizeApplication"
              "FreezeUsers"
              "ManageEncryptionKeys"
              "ManageInternalUsers"
              "ManagePasswordPolicies"
              "ManageProfilesPermissionSets"
              "ManageRoles"
              "ManageSharing"
              "ManageUsers"
              "ModifyAllData"
              "MonitorLoginHistory"
              "MultiFactorAuthenticationRequired"
              "PasswordNeverExpires"
              "ResetPasswordsUnlockUsers"
              "ViewAllData"
          )

          BLOCKED_FILES=()

          if [ ! -f filtered_files.txt ]; then
            echo "No profile or permission set files were modified."
            exit 0
          fi

          while IFS= read -r FILE; do
            [[ -z "$FILE" ]] && continue
            for PERMISSION in "${CRITICAL_PERMISSIONS[@]}"; do
              if grep -q "$PERMISSION" "$FILE" && ! grep -q "System Administrator" "$FILE"; then
                BLOCKED_FILES+=("$FILE")
              fi
            done
          done < filtered_files.txt

          if [ ${#BLOCKED_FILES[@]} -gt 0 ]; then
            echo "Critical permissions found in modified files:"
            for FILE in "${BLOCKED_FILES[@]}"; do
              echo "$FILE"
            done
            exit 1
          else
            echo "No critical permissions found in modified files."
          fi
